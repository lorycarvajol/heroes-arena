<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Fresh Modules - Heroes Arena</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: white; }
        .status { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .success { background: #10b981; }
        .error { background: #ef4444; }
        .info { background: #3b82f6; }
    </style>
</head>
<body>
    <h1>Test Fresh Modules Heroes Arena</h1>
    <div id="output"></div>

    <script type="module">
        const output = document.getElementById('output');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(div);
            console.log(message);
        }

        // Ajouter un timestamp pour éviter le cache
        const timestamp = Date.now();
        
        try {
            log('🚀 Démarrage du test avec cache-busting...', 'info');
            
            // Import avec cache-busting
            const main = await import(`./js/main.js?v=${timestamp}`);
            log('✅ main.js importé avec succès!', 'success');
            
            // Attendre que HeroesArena soit défini
            let attempts = 0;
            const maxAttempts = 50;
            
            const waitForHeroesArena = () => {
                return new Promise((resolve, reject) => {
                    const check = () => {
                        attempts++;
                        if (window.HeroesArena) {
                            resolve();
                        } else if (attempts >= maxAttempts) {
                            reject(new Error('HeroesArena non défini après 5 secondes'));
                        } else {
                            setTimeout(check, 100);
                        }
                    };
                    check();
                });
            };
            
            await waitForHeroesArena();
            log('✅ HeroesArena défini globalement!', 'success');
            
            // Test des fonctions clés
            const functions = ['showSection', 'updateStats', 'startCombat', 'createHeroFromForm'];
            let functionsOK = 0;
            
            functions.forEach(funcName => {
                if (typeof window.HeroesArena[funcName] === 'function') {
                    log(`✅ ${funcName} disponible`, 'success');
                    functionsOK++;
                } else {
                    log(`❌ ${funcName} manquante`, 'error');
                }
            });
            
            if (functionsOK === functions.length) {
                log('🎉 TOUS LES MODULES FONCTIONNENT!', 'success');
                log('Vous pouvez maintenant retourner à index.html', 'info');
            } else {
                log(`⚠️ ${functions.length - functionsOK} fonctions manquantes`, 'error');
            }
            
        } catch (error) {
            log(`❌ Erreur: ${error.message}`, 'error');
            console.error('Erreur détaillée:', error);
        }
    </script>
</body>
</html>
