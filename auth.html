<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes Arena - Authentification</title>
    <style>
        /* Styles d'authentification intégrés au design existant */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .auth-modal {
            background: rgba(26, 22, 37, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            animation: slideInUp 0.4s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b9d, #c44eff, #7c63ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .auth-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            color: #94a3b8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, #ff6b9d, #7c63ff);
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        .auth-field {
            margin-bottom: 20px;
        }

        .auth-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #e2e8f0;
            font-size: 14px;
        }

        .auth-field input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .auth-field input:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.2);
        }

        .auth-button {
            width: 100%;
            background: linear-gradient(135deg, #ff6b9d, #7c63ff);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 157, 0.4);
        }

        .auth-button:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .auth-offline {
            text-align: center;
            padding: 16px;
            background: rgba(255, 107, 157, 0.1);
            border: 1px solid rgba(255, 107, 157, 0.3);
            border-radius: 8px;
            margin-top: 20px;
        }

        .auth-offline button {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
        }

        .auth-offline button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #86efac;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff6b9d, #7c63ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .user-info h3 {
            color: #e2e8f0;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .user-info p {
            color: #94a3b8;
            font-size: 12px;
        }

        .sync-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .sync-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .sync-indicator.syncing {
            background: #fbbf24;
            animation: pulse 1s infinite;
        }

        .sync-indicator.error {
            background: #ef4444;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <!-- Modal d'authentification -->
    <div id="authOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-modal">
            <div class="auth-header">
                <h2>Heroes Arena</h2>
                <p style="color: #94a3b8;">Connectez-vous pour sauvegarder vos héros</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="AuthUI.switchTab('login')">Connexion</button>
                <button class="auth-tab" onclick="AuthUI.switchTab('register')">Inscription</button>
            </div>

            <!-- Formulaire de connexion -->
            <form id="loginForm" class="auth-form active">
                <div id="loginError" class="error-message" style="display: none;"></div>

                <div class="auth-field">
                    <label for="loginUsername">Nom d'utilisateur</label>
                    <input type="text" id="loginUsername" required autocomplete="username">
                </div>

                <div class="auth-field">
                    <label for="loginPassword">Mot de passe</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>

                <button type="submit" class="auth-button" id="loginBtn">Se connecter</button>
            </form>

            <!-- Formulaire d'inscription -->
            <form id="registerForm" class="auth-form">
                <div id="registerError" class="error-message" style="display: none;"></div>
                <div id="registerSuccess" class="success-message" style="display: none;"></div>

                <div class="auth-field">
                    <label for="registerUsername">Nom d'utilisateur</label>
                    <input type="text" id="registerUsername" required autocomplete="username">
                </div>

                <div class="auth-field">
                    <label for="registerEmail">Email (optionnel)</label>
                    <input type="email" id="registerEmail" autocomplete="email">
                </div>

                <div class="auth-field">
                    <label for="registerPassword">Mot de passe</label>
                    <input type="password" id="registerPassword" required autocomplete="new-password">
                </div>

                <div class="auth-field">
                    <label for="registerPasswordConfirm">Confirmer le mot de passe</label>
                    <input type="password" id="registerPasswordConfirm" required autocomplete="new-password">
                </div>

                <button type="submit" class="auth-button" id="registerBtn">S'inscrire</button>
            </form>

            <!-- Option hors ligne -->
            <div class="auth-offline">
                <p><strong>Jouer hors ligne ?</strong></p>
                <p style="font-size: 14px; color: #94a3b8; margin: 8px 0;">
                    Vos héros seront sauvegardés localement uniquement
                </p>
                <button onclick="AuthUI.playOffline()">Continuer hors ligne</button>
            </div>
        </div>
    </div>

    <!-- Panneau utilisateur (quand connecté) -->
    <div id="userPanel" class="user-panel" style="display: none;">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
            <h3 id="userName">Utilisateur</h3>
            <p id="userEmail">user@example.com</p>
        </div>
        <div class="sync-status">
            <div class="sync-indicator" id="syncIndicator"></div>
            <span id="syncText">Synchronisé</span>
        </div>
        <button onclick="AuthUI.logout()" style="
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 16px;
        ">Déconnexion</button>
    </div>

    <script type="module">
        import { cloudStorage } from './js/cloud-storage.js';

        class AuthUI {
            constructor() {
                this.currentTab = 'login';
                this.isOnlineMode = false;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.checkAuthStatus();
            }

            setupEventListeners() {
                // Formulaires
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });

                document.getElementById('registerForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleRegister();
                });

                // Raccourci clavier pour fermer
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.hideAuth();
                    }
                });
            }

            async checkAuthStatus() {
                if (cloudStorage.isLoggedIn()) {
                    const verification = await cloudStorage.verifyToken();
                    if (verification.valid) {
                        this.showUserPanel();
                        this.isOnlineMode = true;
                        return;
                    }
                }
                this.showAuth();
            }

            switchTab(tab) {
                this.currentTab = tab;

                // Mettre à jour les onglets
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelector(`[onclick="AuthUI.switchTab('${tab}')"]`).classList.add('active');

                // Mettre à jour les formulaires
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                document.getElementById(`${tab}Form`).classList.add('active');

                // Effacer les messages d'erreur
                this.clearMessages();
            }

            async handleLogin() {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;

                if (!username || !password) {
                    this.showError('login', 'Veuillez remplir tous les champs');
                    return;
                }

                this.setLoading('login', true);

                try {
                    const result = await cloudStorage.login(username, password);

                    if (result.success) {
                        this.showUserPanel();
                        this.hideAuth();
                        this.isOnlineMode = true;

                        // Charger les héros depuis le cloud
                        await this.syncHeroesFromCloud();

                        this.showNotification('Connexion réussie !', 'success');
                    }
                } catch (error) {
                    this.showError('login', error.message || 'Erreur de connexion');
                } finally {
                    this.setLoading('login', false);
                }
            }

            async handleRegister() {
                const username = document.getElementById('registerUsername').value.trim();
                const email = document.getElementById('registerEmail').value.trim();
                const password = document.getElementById('registerPassword').value;
                const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

                if (!username || !password) {
                    this.showError('register', 'Nom d\'utilisateur et mot de passe requis');
                    return;
                }

                if (password !== passwordConfirm) {
                    this.showError('register', 'Les mots de passe ne correspondent pas');
                    return;
                }

                if (password.length < 6) {
                    this.showError('register', 'Le mot de passe doit contenir au moins 6 caractères');
                    return;
                }

                this.setLoading('register', true);

                try {
                    const result = await cloudStorage.register(username, password, email);

                    if (result.success) {
                        this.showSuccess('register', 'Inscription réussie ! Vous pouvez maintenant vous connecter.');

                        // Basculer vers la connexion après 2 secondes
                        setTimeout(() => {
                            this.switchTab('login');
                            document.getElementById('loginUsername').value = username;
                        }, 2000);
                    }
                } catch (error) {
                    this.showError('register', error.message || 'Erreur lors de l\'inscription');
                } finally {
                    this.setLoading('register', false);
                }
            }

            async logout() {
                try {
                    await cloudStorage.logout();
                    this.hideUserPanel();
                    this.isOnlineMode = false;
                    this.showAuth();
                    this.showNotification('Déconnexion réussie', 'info');

                    // Optionnel : effacer les données locales
                    if (confirm('Voulez-vous également supprimer les données locales ?')) {
                        if (window.HeroesArena && window.HeroesArena.clearAllHeroesHandler) {
                            window.HeroesArena.clearAllHeroesHandler();
                        }
                    }
                } catch (error) {
                    console.error('Erreur lors de la déconnexion:', error);
                }
            }

            playOffline() {
                this.hideAuth();
                this.isOnlineMode = false;
                this.showNotification('Mode hors ligne activé', 'info');
            }

            showAuth() {
                document.getElementById('authOverlay').style.display = 'flex';
            }

            hideAuth() {
                document.getElementById('authOverlay').style.display = 'none';
            }

            showUserPanel() {
                const user = cloudStorage.getCurrentUser();
                if (!user) return;

                document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();
                document.getElementById('userName').textContent = user.username;
                document.getElementById('userEmail').textContent = user.email || 'Pas d\'email';
                document.getElementById('userPanel').style.display = 'flex';
            }

            hideUserPanel() {
                document.getElementById('userPanel').style.display = 'none';
            }

            showError(form, message) {
                const errorEl = document.getElementById(`${form}Error`);
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            }

            showSuccess(form, message) {
                const successEl = document.getElementById(`${form}Success`);
                if (successEl) {
                    successEl.textContent = message;
                    successEl.style.display = 'block';
                }
            }

            clearMessages() {
                document.querySelectorAll('.error-message, .success-message').forEach(el => {
                    el.style.display = 'none';
                });
            }

            setLoading(form, loading) {
                const btn = document.getElementById(`${form}Btn`);
                btn.disabled = loading;
                btn.textContent = loading ?
                    (form === 'login' ? 'Connexion...' : 'Inscription...') :
                    (form === 'login' ? 'Se connecter' : 'S\'inscrire');
            }

            setSyncStatus(status, text) {
                const indicator = document.getElementById('syncIndicator');
                const syncText = document.getElementById('syncText');

                indicator.className = `sync-indicator ${status}`;
                syncText.textContent = text;
            }

            async syncHeroesFromCloud() {
                if (!this.isOnlineMode) return;

                try {
                    this.setSyncStatus('syncing', 'Synchronisation...');

                    const result = await cloudStorage.loadHeroes();
                    if (result.success && result.heroes) {
                        // Intégrer avec le système existant
                        if (window.HeroesArena && window.HeroesArena.getAppState) {
                            const appState = window.HeroesArena.getAppState();

                            // Remplacer les héros locaux par ceux du cloud
                            appState.heroes.length = 0;
                            result.heroes.forEach(heroData => {
                                const hero = this.recreateHeroFromData(heroData);
                                if (hero) appState.heroes.push(hero);
                            });

                            // Mettre à jour l'affichage
                            if (window.HeroesArena.displayHeroes) {
                                window.HeroesArena.displayHeroes();
                            }
                            if (window.HeroesArena.updateFighterSelectors) {
                                window.HeroesArena.updateFighterSelectors();
                            }
                        }

                        this.setSyncStatus('', 'Synchronisé');
                        this.showNotification(`${result.heroes.length} héros chargés depuis le cloud`, 'success');
                    }
                } catch (error) {
                    this.setSyncStatus('error', 'Erreur sync');
                    console.error('Erreur de synchronisation:', error);
                }
            }

            async syncHeroesToCloud() {
                if (!this.isOnlineMode) return;

                try {
                    this.setSyncStatus('syncing', 'Sauvegarde...');

                    if (window.HeroesArena && window.HeroesArena.getAppState) {
                        const appState = window.HeroesArena.getAppState();
                        const heroesData = appState.heroes.map(hero => hero.toJSON());

                        const result = await cloudStorage.saveHeroes(heroesData);
                        if (result.success) {
                            this.setSyncStatus('', 'Synchronisé');
                            this.showNotification('Héros sauvegardés dans le cloud', 'success');
                        }
                    }
                } catch (error) {
                    this.setSyncStatus('error', 'Erreur sync');
                    console.error('Erreur de sauvegarde:', error);
                }
            }

            recreateHeroFromData(data) {
                // Utiliser la factory existante si disponible
                if (window.HeroesArena && window.HeroesArena.createHero) {
                    // Cette fonction devra être adaptée pour accepter les données complètes
                    return window.HeroesArena.createHeroFromData(data);
                }
                return null;
            }

            showNotification(message, type = 'info') {
                // Utiliser le système de notification existant si disponible
                if (window.eventManager && window.eventManager.showNotification) {
                    window.eventManager.showNotification(message, type);
                } else {
                    // Fallback simple
                    console.log(`[${type.toUpperCase()}] ${message}`);
                }
            }

            // Méthodes publiques pour l'intégration
            isOnline() {
                return this.isOnlineMode;
            }

            async autoSave() {
                if (this.isOnlineMode) {
                    await this.syncHeroesToCloud();
                }
            }
        }

        // Instance globale
        window.AuthUI = new AuthUI();

        // Exposer les méthodes nécessaires
        window.AuthUI.switchTab = window.AuthUI.switchTab.bind(window.AuthUI);
        window.AuthUI.logout = window.AuthUI.logout.bind(window.AuthUI);
        window.AuthUI.playOffline = window.AuthUI.playOffline.bind(window.AuthUI);
    </script>
</body>

</html>
